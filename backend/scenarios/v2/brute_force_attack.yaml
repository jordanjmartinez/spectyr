detections:
  - id: "det_lockout"
    rule_name: "Account Lockout After Repeated External Failures"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["s5"]
    mitre:
      id: "T1110.001"
      tactic: "Credential Access"
    description: "A domain account locked out (4740) after a burst of failed logons from a single external source, consistent with online password guessing."
    disposition: "true_positive"
  - id: "det_bruteforce_burst"
    rule_name: "Repeated Failed Logons from a Single External Source"
    rule_type: "sigma_behavioral"
    severity: "medium"
    triggers: ["s1"]
    mitre:
      id: "T1110.001"
      tactic: "Credential Access"
    description: "Many failed logons (4625) from one external source in a short window preceded the lockout, the online password-guessing signature."
    disposition: "true_positive"
  - id: "det_privileged_lockout_fp"
    rule_name: "Privileged Service Account Locked Out"
    rule_type: "sigma_behavioral"
    severity: "critical"
    triggers: ["sup1", "sup2", "sup3"]
    mitre:
      id: "T1110.001"
      tactic: "Credential Access"
    description: "A backup service account locked out on the domain controller reads like a targeted attack on backup infrastructure. It is svc_backup failing repeatedly after a password rotation was not propagated, then locking out: one privileged service account from the internal backup server, not the attack's external source."
    disposition: "false_positive"

answer_key:
  classification: "Brute Force"
  scope:
    hosts: ["dc"]
    accounts: ["victim"]
  root_cause: "s1"
  techniques: ["T1110.001"]
  actions: []

triage_review:
  mitre:
    id: "T1110.001"
    name: "Brute Force: Password Guessing"
    tactic: "Credential Access"
    url: "https://attack.mitre.org/techniques/T1110/001/"
  what_is_it:
    title: "Dictionary Attack"
    description: "A dictionary attack is a brute force method where attackers use automated tools to rapidly cycle through a wordlist of common passwords against a single account. This differs from password spraying, which tries one password across many accounts, and credential stuffing, which reuses stolen credentials from previous breaches."
  response_actions:
    - "Lock the targeted account and reset the password"
    - "Block the attacking source IP at the firewall"
    - "Determine if any successful authentication occurred from the attacker's IP"
    - "If compromised, investigate for lateral movement to other systems"
    - "Verify MFA is enabled on the account and enforce it if not"
