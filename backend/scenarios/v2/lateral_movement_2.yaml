# Schema v2 (Phase 2 Stage 0). Migrated from scenarios/lateral_movement_2.yaml by
# scenarios/migrate_v1_to_v2.py; the attack steps are the v1 chain
# byte-for-byte plus id/host/user tags (parity_check_v2.py proves it).
# Edit this file, not the v1 copy, once the loader flag flips to yaml_v2.
schema_version: 2
label: "lateral_movement_2"
category: "Lateral Movement"
difficulty: 3
threat_pattern: "LSASS Credential Dumping"

narrative:
  ticket_title: "Process Accessed Protected System Memory"
  storyline: "A workstation generated alerts indicating a process accessed sensitive system memory. A second tool was later executed from a temporary directory. Shortly after, a network authentication was recorded on an internal server from the same host."

entities:
  victim:
    type: "employee"

environment:
  org:
    name: "ACME Corp"
    domain: "acme.local"
  hosts:
    - id: "ws_victim"
      role: "workstation"
      hostname: "{victim.hostname}"
      ip: "{victim.ip}"
      os: "Windows 11 Enterprise"
      desc: "User workstation"
    - id: "file"
      role: "file"
      hostname: "{infra.file.hostname}"
      ip: "{infra.file.ip}"
      os: "Windows Server 2019"
      desc: "File Server"
  accounts:
    - id: "victim"
      username: "{victim.username}"
      domain: "ACME"
      type: "user"
      host: "ws_victim"

attack:
  - id: "s1"
    host: "ws_victim"
    user: "victim"
    offset: 0
    event_type: "ProcessCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "medium"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Process created: procdump64.exe"
    key_value_pairs:
      event_id: 1
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      process_id: "19840"
      image: "C:\\Users\\{victim.username}\\Downloads\\procdump64.exe"
      file_version: "11.0.0.0"
      description: "Sysinternals process dump utility"
      product: "ProcDump"
      company: "Sysinternals - www.sysinternals.com"
      original_file_name: "procdump.exe"
      command_line: "\"C:\\Users\\{victim.username}\\Downloads\\procdump64.exe\" -ma lsass.exe C:\\Users\\{victim.username}\\AppData\\Local\\Temp\\debug_report.dmp"
      current_directory: "C:\\Users\\{victim.username}\\Downloads\\"
      user: "{victim.user_domain}"
      terminal_session_id: "1"
      integrity_level: "High"
      parent_process_id: "9104"
      parent_image: "C:\\Windows\\System32\\cmd.exe"
      parent_command_line: "\"C:\\Windows\\System32\\cmd.exe\""
      parent_user: "{victim.user_domain}"

  - id: "s2"
    host: "ws_victim"
    user: "victim"
    offset: [2, 5]
    trigger: true
    event_type: "ProcessAccess"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "critical"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Process accessed: lsass.exe by procdump64.exe"
    key_value_pairs:
      event_id: 10
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      source_process_guid: "{B4C2E1A7-3F8D-6620-1A00-000000000400}"
      source_process_id: "19840"
      source_thread_id: "7204"
      source_image: "C:\\Users\\{victim.username}\\Downloads\\procdump64.exe"
      target_process_guid: "{B4C2E1A7-0001-6620-0100-000000000400}"
      target_process_id: "648"
      target_image: "C:\\Windows\\System32\\lsass.exe"
      granted_access: "0x1fffff"
      call_trace: "C:\\Windows\\SYSTEM32\\ntdll.dll|C:\\Windows\\System32\\KERNELBASE.dll|C:\\Windows\\System32\\dbgcore.dll"
      source_user: "{victim.user_domain}"
      target_user: "NT AUTHORITY\\SYSTEM"

  - id: "s3"
    host: "ws_victim"
    user: "victim"
    offset: [1, 3]
    event_type: "FileCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "File created: debug_report.dmp"
    key_value_pairs:
      event_id: 11
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      process_id: "19840"
      image: "C:\\Users\\{victim.username}\\Downloads\\procdump64.exe"
      target_filename: "C:\\Users\\{victim.username}\\AppData\\Local\\Temp\\debug_report.dmp"
      user: "{victim.user_domain}"

  - id: "s4"
    host: "ws_victim"
    user: "victim"
    offset: [5, 12]
    event_type: "ProcessCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "critical"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Process created: mimikatz.exe"
    key_value_pairs:
      event_id: 1
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      process_id: "21056"
      image: "C:\\Users\\{victim.username}\\AppData\\Local\\Temp\\mimikatz.exe"
      file_version: ""
      description: ""
      product: ""
      company: ""
      original_file_name: "mimikatz.exe"
      command_line: "\"C:\\Users\\{victim.username}\\AppData\\Local\\Temp\\mimikatz.exe\" \"sekurlsa::minidump C:\\Users\\{victim.username}\\AppData\\Local\\Temp\\debug_report.dmp\" \"sekurlsa::logonPasswords\" \"exit\""
      current_directory: "C:\\Users\\{victim.username}\\AppData\\Local\\Temp\\"
      user: "{victim.user_domain}"
      terminal_session_id: "1"
      integrity_level: "High"
      parent_process_id: "9104"
      parent_image: "C:\\Windows\\System32\\cmd.exe"
      parent_command_line: "\"C:\\Windows\\System32\\cmd.exe\""
      parent_user: "{victim.user_domain}"

  - id: "s5"
    host: "file"
    user: "victim"
    offset: [2, 5]
    event_type: "4624"
    source_type: "Windows Security"
    log_source: "Windows Security"
    severity: "critical"
    hostname: "{infra.file.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.file.ip}"
    message: "An account was successfully logged on."
    key_value_pairs:
      event_id: 4624
      channel: "WinEventLog:Security"
      computer: "{infra.file.hostname}"
      subject_security_id: "NULL SID"
      subject_account_name: "-"
      subject_account_domain: "-"
      subject_logon_id: "0x0"
      logon_type: "3"
      account_name: "{victim.username}"
      account_domain: "ACME"
      new_logon_logon_id: "0xF4A391"
      logon_guid: "{00000000-0000-0000-0000-000000000000}"
      process_id: "0x0"
      process_name: "-"
      workstation_name: "{victim.hostname}"
      src_ip: "{victim.ip}"
      src_port: "49201"
      logon_process: "NtLmSsp"
      authentication_package: "NTLM"
      transited_services: "-"
      package_name: "-"
      key_length: "0"

noise: {}

detections:
  - id: "det_lsass"
    rule_name: "LSASS Process Memory Access"
    rule_type: "sigma_behavioral"
    severity: "critical"
    triggers: ["s2"]
    mitre:
      id: "T1003.001"
      tactic: "Credential Access"
    description: "A non-system process opened a handle to lsass.exe memory, the signature action of credential dumping."
    disposition: "true_positive"

answer_key:
  classification: "Lateral Movement"
  scope:
    hosts: ["ws_victim", "file"]
    accounts: ["victim"]
  root_cause: "s1"
  techniques: ["T1003.001"]
  actions: []

triage_review:
  mitre:
    id: "T1003.001"
    name: "OS Credential Dumping: LSASS Memory"
    tactic: "Credential Access"
    url: "https://attack.mitre.org/techniques/T1003/001/"
  what_is_it:
    title: "LSASS Credential Dumping"
    description: "LSASS is the Windows process that caches credentials for every user logged into a machine, including password hashes, Kerberos tickets, and sometimes plaintext passwords. Attackers dump LSASS memory using legitimate tools like ProcDump or Task Manager, then extract credentials offline with tools like Mimikatz. One dump on one workstation can compromise every account cached on that machine, including domain admins."
  response_actions:
    - "Isolate the workstation but do not shut it down"
    - "Identify every account that was logged into that machine and treat them all as compromised"
    - "Reset passwords and revoke Kerberos tickets for all affected accounts"
    - "Search for lateral movement from the compromised host"
    - "Scan other endpoints for dumping tools or suspicious .dmp files"
    - "Escalate to incident response"
