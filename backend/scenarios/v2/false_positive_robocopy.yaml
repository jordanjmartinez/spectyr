# Schema v2 (Phase 2 Stage 0). Migrated from scenarios/false_positive_robocopy.yaml by
# scenarios/migrate_v1_to_v2.py; the attack steps are the v1 chain
# byte-for-byte plus id/host/user tags (parity_check_v2.py proves it).
# Edit this file, not the v1 copy, once the loader flag flips to yaml_v2.
schema_version: 2
label: "false_positive_robocopy"
category: "False Positive"
difficulty: 2
threat_pattern: "Authorized IT Migration \u2014 Robocopy to OneDrive for Business"

narrative:
  ticket_title: "Large Outbound Transfer to OneDrive"
  storyline: "A scheduled task executed on a workstation under a service account and began copying a large volume of files from an internal file share. Over 2 GB of data was transferred outbound to a cloud endpoint. IT operations has a standing migration project scheduled this quarter."

entities:
  victim:
    type: "employee"
  sharepoint:
    type: "domain"
    value: "acme-my.sharepoint.com"
  sharepoint_ip:
    type: "external_ip"
    ip: "52.96.128.144"

environment:
  org:
    name: "ACME Corp"
    domain: "acme.local"
  hosts:
    - id: "ws_victim"
      role: "workstation"
      hostname: "{victim.hostname}"
      ip: "{victim.ip}"
      os: "Windows 10 Enterprise"
      desc: "User workstation"
    - id: "file"
      role: "file"
      hostname: "{infra.file.hostname}"
      ip: "{infra.file.ip}"
      os: "Windows Server 2019"
      desc: "File Server"
    - id: "dns"
      role: "dns"
      hostname: "{infra.dns.hostname}"
      ip: "{infra.dns.ip}"
      os: "Windows Server 2019"
      desc: "DNS Server"
    - id: "proxy"
      role: "proxy"
      hostname: "{infra.proxy.hostname}"
      ip: "{infra.proxy.ip}"
      os: "PAN-OS"
      desc: "Proxy (PAN-OS VM-Series)"
    - id: "fw_perimeter"
      role: "firewall"
      hostname: "ACME-FW01"
      ip: "10.0.1.254"
      os: "PAN-OS"
      desc: "Perimeter Firewall"
  accounts:
    - id: "victim"
      username: "{victim.username}"
      domain: "ACME"
      type: "user"
      host: "ws_victim"

attack:
  - id: "s1"
    host: "ws_victim"
    user: "victim"
    offset: 0
    trigger: true
    event_type: "ProcessCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Process created: robocopy.exe launched by svchost.exe"
    key_value_pairs:
      event_id: 1
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      process_id: "4812"
      image: "C:\\Windows\\System32\\robocopy.exe"
      file_version: "10.0.19041.1"
      description: "Microsoft Robocopy"
      product: "Microsoft Windows Operating System"
      company: "Microsoft Corporation"
      original_file_name: "robocopy.exe"
      command_line: "robocopy \\\\{infra.file.ip}\\Users\\{victim.username} Z:\\{victim.username} /MIR /MT:32 /R:3 /W:5 /LOG:C:\\Logs\\migration_{victim.username}.txt"
      current_directory: "C:\\Windows\\System32\\"
      user: "{victim.user_domain}"
      terminal_session_id: "0"
      integrity_level: "High"
      parent_process_id: "876"
      parent_image: "C:\\Windows\\System32\\svchost.exe"
      parent_command_line: "svchost.exe -k netsvcs -p -s Schedule"
      parent_user: "NT AUTHORITY\\SYSTEM"

  - id: "s2"
    host: "file"
    user: "victim"
    offset: [2, 5]
    event_type: "4663"
    source_type: "Windows Security"
    log_source: "Windows Security"
    severity: "high"
    hostname: "{infra.file.ip}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "An attempt was made to access an object."
    key_value_pairs:
      event_id: 4663
      channel: "WinEventLog:Security"
      computer: "{infra.file.ip}"
      subject_security_id: "S-1-5-21-1547161642-1842894336-919524151-1105"
      account_name: "{victim.user_domain}"
      account_domain: "ACME"
      subject_logon_id: "0xD4E5F6"
      object_server: "Security"
      object_type: "File"
      object_name: "\\\\{infra.file.ip}\\Users\\{victim.username}\\"
      handle_id: "0x1234"
      resource_attributes: "-"
      process_id: "4812"
      process_name: "C:\\Windows\\System32\\robocopy.exe"
      accesses: "ReadData (or next entry)"
      access_mask: "0x1"

  - id: "s3"
    host: "ws_victim"
    user: "victim"
    offset: [1, 3]
    event_type: "QUERY"
    source_type: "DNS"
    log_source: "DNS"
    severity: "medium"
    hostname: "{infra.dns.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.dns.ip}"
    user_account: "ACME\\{victim.username}"
    message: "DNS query for {sharepoint.value} resolved to {sharepoint_ip.ip}"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.dns.ip}"
      src_port: "53201"
      dest_port: "53"
      transport: "udp"
      query: "{sharepoint.value}"
      query_type: "A"
      message_type: "QUERY"
      reply_code: "NOERROR"
      dvc: "{infra.dns.hostname}"

  - id: "s4"
    host: "ws_victim"
    user: "victim"
    offset: [1, 3]
    event_type: "ALLOW"
    source_type: "Firewall"
    log_source: "Firewall"
    severity: "high"
    hostname: "ACME-FW01"
    source_ip: "{victim.ip}"
    destination_ip: "{sharepoint_ip.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Outbound connection permitted to {sharepoint_ip.ip} on port 443"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{sharepoint_ip.ip}"
      src_port: "53202"
      dest_port: "443"
      transport: "tcp"
      action: "allow"
      app: "ssl"
      dvc: "ACME-FW01"
      rule: "https_outbound"

  - id: "s5"
    host: "ws_victim"
    user: "victim"
    offset: [20, 45]
    event_type: "FileSyncUploadedFull"
    source_type: "Proxy"
    log_source: "Proxy"
    severity: "low"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{sharepoint_ip.ip}"
    user_account: "ACME\\{victim.username}"
    message: "File sync operation to {sharepoint.value}"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{sharepoint_ip.ip}"
      src_user: "{victim.user_domain}"
      dvc: "{infra.proxy.hostname}"
      url: "{sharepoint.value}"
      app: "microsoft-onedrive"
      transport: "tcp"
      dest_port: "443"
      action: "allow"
      http_method: "PUT"
      user_agent: "Microsoft SkyDriveSync/24.001.0107.0003 OneDrive-Windows/23.234.1121.0003"
      site_url: "https://{sharepoint.value}/personal/{victim.username}_acme_com"
      file_count: "847"
      bytes_uploaded: "2415919104"

noise: {}

supplemental_events: []

supplemental_entities: []

detections:
  - id: "det_fp_robocopy"
    rule_name: "Bulk File Copy by Service Account"
    rule_type: "sigma_behavioral"
    severity: "medium"
    triggers: ["s1"]
    description: "A scheduled service account copied a large volume of files to a cloud endpoint as part of a planned migration project."
    disposition: "false_positive"

answer_key:
  classification: "False Positive"
  scope:
    hosts: ["ws_victim", "file"]
    accounts: ["victim"]
  root_cause: null
  techniques: []
  actions: []

triage_review:
  what_is_it:
    title: "Scheduled Data Migration"
    description: "Robocopy and similar bulk file transfer tools generate high-volume file access patterns that closely resemble data exfiltration. Legitimate IT migrations involving large outbound transfers to cloud endpoints can trigger data loss prevention and exfiltration alerts."
  response_actions:
    - "Check change management for approved migration tasks"
    - "Verify the service account running the transfer is authorized"
    - "Confirm the destination endpoint is an approved cloud target"
    - "Validate the transfer volume against the migration scope"
    - "Whitelist the scheduled task for the migration window"
