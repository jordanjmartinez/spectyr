# Schema v2 (Phase 2 Stage 0). Migrated from scenarios/lateral_movement_1.yaml by
# scenarios/migrate_v1_to_v2.py; the attack steps are the v1 chain
# byte-for-byte plus id/host/user tags (parity_check_v2.py proves it).
# Edit this file, not the v1 copy, once the loader flag flips to yaml_v2.
schema_version: 2
label: "lateral_movement_1"
category: "Lateral Movement"
difficulty: 2
threat_pattern: "Internal Reconnaissance (Port Scan)"

narrative:
  ticket_title: "Rapid Internal Connection Attempts"
  storyline: "Unexpected network activity was detected originating from an internal workstation with no scheduled maintenance or administrative tasks. The firewall logged multiple connection attempts to an internal server in rapid succession."

entities:
  victim:
    type: "employee"

environment:
  org:
    name: "ACME Corp"
    domain: "acme.local"
  hosts:
    - id: "ws_victim"
      role: "workstation"
      hostname: "{victim.hostname}"
      ip: "{victim.ip}"
      os: "Windows 11 Enterprise"
      desc: "User workstation"
    - id: "file"
      role: "file"
      hostname: "{infra.file.hostname}"
      ip: "{infra.file.ip}"
      os: "Windows Server 2019"
      desc: "File Server"
    - id: "scan"
      role: "scanner"
      hostname: "{infra.scan.hostname}"
      ip: "{infra.scan.ip}"
      os: "Windows Server 2019"
      desc: "Security Scanner"
    - id: "fw_perimeter"
      role: "firewall"
      hostname: "ACME-FW01"
      ip: "10.0.1.254"
      os: "PAN-OS"
      desc: "Perimeter Firewall"
  accounts:
    - id: "victim"
      username: "{victim.username}"
      domain: "ACME"
      type: "user"
      host: "ws_victim"
    - id: "svc_vulnscan"
      username: "svc_vulnscan"
      domain: "ACME"
      type: "service"
      host: "scan"
      groups: ["Domain Users", "Scanning Service Accounts"]

attack:
  - id: "s1"
    host: "ws_victim"
    user: "victim"
    offset: 0
    event_type: "ProcessCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "low"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Process created: nmap.exe launched by cmd.exe"
    key_value_pairs:
      event_id: 1
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      process_id: "8844"
      image: "C:\\Users\\{victim.username}\\Downloads\\nmap-7.95\\nmap.exe"
      file_version: "7.95"
      description: "Nmap - Network exploration tool"
      product: "Nmap"
      company: "Nmap Project"
      original_file_name: "nmap.exe"
      command_line: "nmap.exe -sS -p 22,80,443,445,3389 {infra.file.ip}"
      current_directory: "C:\\Users\\{victim.username}\\Downloads\\nmap-7.95\\"
      user: "{victim.user_domain}"
      terminal_session_id: "1"
      integrity_level: "High"
      parent_process_id: "6240"
      parent_image: "C:\\Windows\\System32\\cmd.exe"
      parent_command_line: "\"C:\\Windows\\System32\\cmd.exe\""
      parent_user: "{victim.user_domain}"

  - id: "s2"
    host: "ws_victim"
    offset: [5, 12]
    event_type: "DENY"
    source_type: "Firewall"
    log_source: "Firewall"
    severity: "medium"
    hostname: "ACME-FW01"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.file.ip}"
    message: "Connection denied from {victim.hostname} to {infra.file.hostname} on port 22 (tcp)."
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.file.ip}"
      src_port: "49152"
      dest_port: "22"
      transport: "tcp"
      action: "deny"
      app: "ssh"
      dvc: "ACME-FW01"
      rule: "default_internal"

  - id: "s3"
    host: "ws_victim"
    offset: [1, 2]
    event_type: "DENY"
    source_type: "Firewall"
    log_source: "Firewall"
    severity: "medium"
    hostname: "ACME-FW01"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.file.ip}"
    message: "Connection denied from {victim.hostname} to {infra.file.hostname} on port 445 (tcp)."
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.file.ip}"
      src_port: "49153"
      dest_port: "445"
      transport: "tcp"
      action: "deny"
      app: "microsoft-ds"
      dvc: "ACME-FW01"
      rule: "default_internal"

  - id: "s4"
    host: "ws_victim"
    offset: [2, 5]
    event_type: "ALLOW"
    source_type: "Firewall"
    log_source: "Firewall"
    severity: "high"
    hostname: "ACME-FW01"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.file.ip}"
    message: "RDP connection permitted from {victim.hostname} to {infra.file.hostname} on port 3389"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.file.ip}"
      src_port: "49154"
      dest_port: "3389"
      transport: "tcp"
      action: "allow"
      app: "ms-rdp"
      dvc: "ACME-FW01"
      rule: "default_internal"

  - id: "s5"
    host: "file"
    user: "victim"
    offset: [2, 5]
    trigger: true
    event_type: "4624"
    source_type: "Windows Security"
    log_source: "Windows Security"
    severity: "high"
    hostname: "{infra.file.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.file.ip}"
    message: "An account was successfully logged on."
    key_value_pairs:
      event_id: 4624
      channel: "WinEventLog:Security"
      computer: "{infra.file.hostname}"
      subject_security_id: "NULL SID"
      subject_account_name: "-"
      subject_account_domain: "-"
      subject_logon_id: "0x0"
      logon_type: "10"
      account_name: "{victim.username}"
      account_domain: "ACME"
      new_logon_logon_id: "0xA1B2C3"
      logon_guid: "{00000000-0000-0000-0000-000000000000}"
      process_id: "0x0"
      process_name: "-"
      workstation_name: "{victim.hostname}"
      src_ip: "{victim.ip}"
      src_port: "49154"
      logon_process: "User32"
      authentication_package: "Negotiate"
      transited_services: "-"
      package_name: "-"
      key_length: "0"

  - id: "s6"
    host: "file"
    user: "victim"
    offset: [3, 8]
    event_type: "ProcessCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "high"
    hostname: "{infra.file.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Process created: net.exe executed on {infra.file.hostname}"
    key_value_pairs:
      event_id: 1
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{infra.file.hostname}"
      rule_name: ""
      process_id: "3312"
      image: "C:\\Windows\\System32\\net.exe"
      file_version: "10.0.19041.1"
      description: "Net Command"
      product: "Microsoft Windows Operating System"
      company: "Microsoft Corporation"
      original_file_name: "net.exe"
      command_line: "net localgroup administrators"
      current_directory: "C:\\Windows\\System32\\"
      user: "{victim.user_domain}"
      terminal_session_id: "2"
      integrity_level: "High"
      parent_process_id: "2104"
      parent_image: "C:\\Windows\\System32\\cmd.exe"
      parent_command_line: "\"C:\\Windows\\System32\\cmd.exe\""
      parent_user: "{victim.user_domain}"

noise: {}

supplemental_events:
  - id: "sup1"
    host: "scan"
    user: "svc_vulnscan"
    offset: -120
    red_herring: true
    event_type: "ProcessCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "low"
    hostname: "{infra.scan.hostname}"
    source_ip: "{infra.scan.ip}"
    user_account: "ACME\\svc_vulnscan"
    message: "Process created: nessusd.exe scheduled vulnerability scan"
    key_value_pairs:
      event_id: 1
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{infra.scan.hostname}"
      rule_name: ""
      process_id: "4120"
      image: "C:\\Program Files\\Tenable\\Nessus\\nessusd.exe"
      file_version: "10.7.2"
      description: "Nessus Vulnerability Scanner"
      product: "Nessus"
      company: "Tenable, Inc."
      original_file_name: "nessusd.exe"
      command_line: "\"C:\\Program Files\\Tenable\\Nessus\\nessusd.exe\" -q"
      current_directory: "C:\\Program Files\\Tenable\\Nessus\\"
      user: "ACME\\svc_vulnscan"
      terminal_session_id: "0"
      integrity_level: "System"
      parent_process_id: "784"
      parent_image: "C:\\Windows\\System32\\services.exe"
      parent_command_line: "C:\\Windows\\System32\\services.exe"
      parent_user: "NT AUTHORITY\\SYSTEM"
  - id: "sup2"
    host: "scan"
    offset: -118
    red_herring: true
    event_type: "ALLOW"
    source_type: "Firewall"
    log_source: "Firewall"
    severity: "medium"
    hostname: "ACME-FW01"
    source_ip: "{infra.scan.ip}"
    destination_ip: "{infra.file.ip}"
    message: "Scheduled scan connections from {infra.scan.hostname} to {infra.file.hostname} across service ports 22,80,443,445,3389"
    key_value_pairs:
      src_ip: "{infra.scan.ip}"
      dst_ip: "{infra.file.ip}"
      src_port: "51200"
      dest_port: "445"
      transport: "tcp"
      action: "allow"
      app: "vuln-scan"
      dvc: "ACME-FW01"
      rule: "security_scanning"

supplemental_entities: []

detections:
  - id: "det_lateral_logon"
    rule_name: "Anomalous Internal Logon Following Connection Sweep"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["s5"]
    mitre:
      id: "T1046"
      tactic: "Discovery"
    description: "A network logon landed on the file server from a workstation that had just probed its service ports. No admin task or ticket explains it; the account is a standard user."
    disposition: "true_positive"
  - id: "det_portscan_exec"
    rule_name: "Network Scanning Utility Executed from User Profile"
    rule_type: "sigma_behavioral"
    severity: "medium"
    triggers: ["s1"]
    mitre:
      id: "T1046"
      tactic: "Discovery"
    description: "nmap ran from a standard user's Downloads folder on a non-IT workstation. Scanning tools there are unusual; here it is the recon that precedes the lateral logon."
    disposition: "true_positive"
  - id: "det_scanner_sweep"
    rule_name: "Rapid Internal Port Connections Across Segment"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["sup2"]
    mitre:
      id: "T1046"
      tactic: "Discovery"
    description: "The security team's authenticated vulnerability scanner ran its scheduled sweep from the scanner host, connecting rapidly to many internal hosts including the file server, and tripped a lateral-recon rule. The source is the scanner host under a service account on the scan schedule."
    disposition: "false_positive"

answer_key:
  classification: "Lateral Movement"
  scope:
    hosts: ["ws_victim", "file"]
    accounts: ["victim"]
  root_cause: "s1"
  techniques: ["T1046"]
  actions_reviewed: true
  actions:
    - id: "a_iso"
      action: "isolate_host"
      status: "required"
      target:
        host: "ws_victim"
    - action: "kill_process"
      status: "required"
      target:
        host: "ws_victim"
        pid: 8844
    - action: "kill_process"
      status: "required"
      target:
        host: "file"
        pid: 2104
    - action: "kill_process"
      status: "acceptable"
      target:
        host: "file"
        pid: 3312
    - action: "kill_process"
      status: "acceptable"
      target:
        host: "ws_victim"
        pid: 6240
    - action: "revoke_sessions"
      status: "required"
      target:
        account: "victim"
    - id: "a_reset"
      action: "force_password_reset"
      status: "required"
      target:
        account: "victim"
      after: ["a_iso"]
    - action: "disable_account"
      status: "acceptable"
      target:
        account: "victim"
  traps:
    - action: "isolate_host"
      target:
        host: "scan"
    - action: "kill_process"
      target:
        host: "scan"
        pid: 4120
    - action: "isolate_host"
      target:
        host: "file"

triage_review:
  mitre:
    id: "T1046"
    name: "Network Service Discovery"
    tactic: "Discovery"
    url: "https://attack.mitre.org/techniques/T1046/"
  what_is_it:
    title: "Network Service Discovery"
    description: "Network service scanning is when someone probes target systems to discover open ports and running services, typically using tools like Nmap. When a scanning tool is found on a standard user's workstation, it indicates either unauthorized reconnaissance or a compromised machine."
  response_actions:
    - "Investigate whether the user intentionally ran the tool or if the workstation is compromised"
    - "Remove the scanning tool"
    - "Search firewall logs for scan activity from the same source"
    - "Check for follow-up activity like exploitation attempts or lateral movement"
    - "Review segmentation rules to confirm workstations cannot reach server management ports"
