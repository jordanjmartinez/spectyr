detections:
  - id: "det_spray"
    rule_name: "Password Spray Pattern Across Many Accounts"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["s6"]
    mitre:
      id: "T1110.003"
      tactic: "Credential Access"
    description: "One source attempted single logons against many distinct accounts in a short window, then authenticated successfully, the password-spray signature."
    disposition: "true_positive"
  - id: "det_multi_account_failures"
    rule_name: "Failed Logons Across Many Accounts from One Source"
    rule_type: "sigma_behavioral"
    severity: "medium"
    triggers: ["s1"]
    mitre:
      id: "T1110.003"
      tactic: "Credential Access"
    description: "One source produced NTLM logon failures against many distinct accounts in a short window, the spray signature, before the successful logon."
    disposition: "true_positive"
  - id: "det_svc_stale_creds_fp"
    rule_name: "Repeated Authentication Failures for a Single Account"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["sup1"]
    mitre:
      id: "T1110.001"
      tactic: "Credential Access"
    description: "One account failed authentication against the domain controller repeatedly at a fixed cadence, reading like targeted brute force. It is a backup service account with a stale password: one account (not many), from the backup server, on a scheduled job."
    disposition: "false_positive"

answer_key:
  classification: "Brute Force"
  scope:
    hosts: ["dc", "ws_victim"]
    accounts: ["dpark", "mjohnson", "bwilliams", "achen", "jkim", "lgreen"]
  root_cause: "s1"
  techniques: ["T1110.003"]
  actions_reviewed: true
  actions:
    - id: "a_iso"
      action: "isolate_host"
      status: "required"
      target:
        host: "ws_victim"
    - action: "revoke_sessions"
      status: "required"
      target:
        account: "lgreen"
    - id: "a_reset"
      action: "force_password_reset"
      status: "required"
      target:
        account: "lgreen"
      after: ["a_iso"]
    - action: "disable_account"
      status: "acceptable"
      target:
        account: "lgreen"
    - action: "force_password_reset"
      status: "acceptable"
      target:
        account: "dpark"
    - action: "force_password_reset"
      status: "acceptable"
      target:
        account: "mjohnson"
    - action: "force_password_reset"
      status: "acceptable"
