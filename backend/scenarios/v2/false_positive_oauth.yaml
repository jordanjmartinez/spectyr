# Schema v2 (Phase 2 Stage 0). Migrated from scenarios/false_positive_oauth.yaml by
# scenarios/migrate_v1_to_v2.py; the attack steps are the v1 chain
# byte-for-byte plus id/host/user tags (parity_check_v2.py proves it).
# Edit this file, not the v1 copy, once the loader flag flips to yaml_v2.
schema_version: 2
label: "false_positive_oauth"
category: "False Positive"
difficulty: 3
threat_pattern: "Authorized Background Authentication \u2014 M365 OAuth Refresh Token Cycle"

narrative:
  ticket_title: "Impossible Travel Sign-In Alert"
  storyline: "Entra ID Protection flagged a user account for anomalous token activity originating from Dublin, Ireland. The user is based in Miami and has not reported any travel. Multiple non-interactive sign-ins were recorded against Office 365 Exchange Online. The identity team recently migrated all endpoints to modern authentication with OAuth refresh tokens."

entities:
  victim:
    type: "employee"

environment:
  org:
    name: "ACME Corp"
    domain: "acme.local"
  hosts:
    - id: "ws_victim"
      role: "workstation"
      hostname: "{victim.hostname}"
      ip: "{victim.ip}"
      os: "Windows 10 Enterprise"
      desc: "User workstation"
    - id: "proxy"
      role: "proxy"
      hostname: "{infra.proxy.hostname}"
      ip: "{infra.proxy.ip}"
      os: "PAN-OS"
      desc: "Proxy (PAN-OS VM-Series)"
  accounts:
    - id: "victim"
      username: "{victim.username}"
      domain: "ACME"
      type: "user"
      host: "ws_victim"

attack:
  - id: "s1"
    host: "ws_victim"
    user: "victim"
    offset: 0
    event_type: "SigninLogs"
    source_type: "Azure AD"
    log_source: "Azure AD"
    severity: "low"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "{victim.username}@acme.com"
    message: "Successful sign-in for {victim.username}@acme.com from {victim.ip}"
    key_value_pairs:
      UserPrincipalName: "{victim.username}@acme.com"
      IPAddress: "{victim.ip}"
      Location: "Miami, FL, US"
      DeviceDetail: "{victim.hostname} - Windows 10 - Compliant - Entra Joined"
      ResultType: "0"
      AppDisplayName: "Microsoft Office"
      AuthenticationRequirement: "singleFactorAuthentication"
      RiskLevelDuringSignIn: "none"
      OperationName: "Sign-in activity"
      IsInteractive: "true"
      ResourceDisplayName: "Office 365 Exchange Online"
      ClientAppUsed: "Modern Authentication Client"
      IncomingTokenType: "none"
      ConditionalAccessStatus: "success"

  - id: "s2"
    host: "ws_victim"
    user: "victim"
    offset: [2, 5]
    event_type: "HTTP_POST"
    source_type: "Proxy"
    log_source: "Proxy"
    severity: "medium"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "20.190.151.7"
    user_account: "{victim.username}@acme.com"
    message: "POST request submitted to login.microsoftonline.com/common/oauth2/v2.0/token returned 200 OK"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "20.190.151.7"
      src_user: "{victim.username}@acme.com"
      dvc: "{infra.proxy.hostname}"
      url: "login.microsoftonline.com/common/oauth2/v2.0/token"
      app: "web-browsing"
      transport: "tcp"
      dest_port: "443"
      action: "allow"
      http_method: "POST"
      bytes_sent: "1024"
      grant_type: "refresh_token"
      scope: "https://outlook.office365.com/.default"
      occurrence_count: "8"
      interval_minutes: "60"

  - id: "s3"
    host: "ws_victim"
    user: "victim"
    offset: [30, 90]
    event_type: "SigninLogs"
    source_type: "Azure AD"
    log_source: "Azure AD"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "20.190.151.7"
    user_account: "{victim.username}@acme.com"
    message: "Successful sign-in for {victim.username}@acme.com from 20.190.151.7"
    key_value_pairs:
      UserPrincipalName: "{victim.username}@acme.com"
      IPAddress: "20.190.151.7"
      Location: "Dublin, IE"
      DeviceDetail: "{victim.hostname} - Windows 10 - Compliant - Entra Joined"
      ResultType: "0"
      AppDisplayName: "Microsoft Office"
      AuthenticationRequirement: "singleFactorAuthentication"
      RiskLevelDuringSignIn: "low"
      OperationName: "Sign-in activity"
      IsInteractive: "false"
      SignInEventType: "nonInteractiveUser"
      ResourceDisplayName: "Office 365 Exchange Online"
      ClientAppUsed: "Modern Authentication Client"
      IncomingTokenType: "refreshToken"
      ConditionalAccessStatus: "notApplied"
      SignInCount: "8"

  - id: "s4"
    host: "ws_victim"
    user: "victim"
    offset: [5, 15]
    trigger: true
    event_type: "AADUserRiskEvents"
    source_type: "Azure AD"
    log_source: "Azure AD"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "20.190.151.7"
    user_account: "{victim.username}@acme.com"
    message: "Anomalous token risk flagged for {victim.username}@acme.com"
    key_value_pairs:
      UserPrincipalName: "{victim.username}@acme.com"
      RiskEventType: "anomalousToken"
      RiskLevel: "low"
      RiskState: "atRisk"
      RiskDetail: "unfamiliarFeatures"
      DetectionTimingType: "offline"
      Location: "Dublin, IE"
      IPAddress: "20.190.151.7"
      Activity: "signin"
      TokenIssuerType: "AzureAD"
      MitreTechnique: "T1528"

noise: {}

supplemental_events: []

supplemental_entities: []

detections:
  - id: "det_fp_oauth"
    rule_name: "Impossible-Travel Sign-In Risk"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["s4"]
    description: "Entra flagged a sign-in from an unexpected location, reading like account takeover. It is a modern-auth OAuth refresh token after an endpoint migration, a common benign trigger."
    disposition: "false_positive"
  - id: "det_oauth_noninteractive_fp"
    rule_name: "Non-Interactive OAuth Token Activity from New Location"
    rule_type: "sigma_behavioral"
    severity: "medium"
    triggers: ["s2"]
    description: "A token-based sign-in from an unexpected location reads like token theft or replay. It is a non-interactive refresh-token renewal from the migrated device."
    disposition: "false_positive"

answer_key:
  classification: "False Positive"
  scope:
    hosts: ["ws_victim"]
    accounts: ["victim"]
  root_cause: null
  techniques: []
  actions: []

triage_review:
  what_is_it:
    title: "OAuth Token Refresh Activity"
    description: "Modern authentication using OAuth generates non-interactive sign-in events from Microsoft's global infrastructure. Token refreshes can originate from data centers in different countries, triggering impossible travel and anomalous location alerts even when the user hasn't moved."
  response_actions:
    - "Check if the sign-ins are non-interactive token refreshes versus user logins"
    - "Verify the application is a known first-party service like Exchange Online"
    - "Confirm with the identity team if modern auth was recently enabled"
    - "Review the user's interactive sign-in history for actual anomalies"
    - "Tune the impossible travel policy to exclude non-interactive sign-ins"
