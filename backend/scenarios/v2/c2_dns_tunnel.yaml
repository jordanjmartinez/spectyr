# Schema v2 (Phase 2 Stage 0). Migrated from scenarios/c2_dns_tunnel.yaml by
# scenarios/migrate_v1_to_v2.py; the attack steps are the v1 chain
# byte-for-byte plus id/host/user tags (parity_check_v2.py proves it).
# Edit this file, not the v1 copy, once the loader flag flips to yaml_v2.
schema_version: 2
label: "c2_dns_tunnel"
category: "Command & Control"
difficulty: 3
threat_pattern: "DNS Tunneling C2"

narrative:
  ticket_title: "DNS Queries to Unrecognized Domain"
  storyline: "The DNS server logged repeated TXT queries from a single workstation to subdomains of a domain not on any internal or approved service list. The subdomain labels appear non-standard. Shortly before the queries began, the workstation launched an unfamiliar process from the Downloads folder."

entities:
  victim:
    type: "employee"
  tunnel_domain:
    type: "domain"
    value: "cloudmetrics-sync.net"

environment:
  org:
    name: "ACME Corp"
    domain: "acme.local"
  hosts:
    - id: "ws_victim"
      role: "workstation"
      hostname: "{victim.hostname}"
      ip: "{victim.ip}"
      os: "Windows 11 Enterprise"
      desc: "User workstation"
    - id: "dns"
      role: "dns"
      hostname: "{infra.dns.hostname}"
      ip: "{infra.dns.ip}"
      os: "Windows Server 2019"
      desc: "DNS Server"
    - id: "fw_perimeter"
      role: "firewall"
      hostname: "ACME-FW01"
      ip: "10.0.1.254"
      os: "PAN-OS"
      desc: "Perimeter Firewall"
  accounts:
    - id: "victim"
      username: "{victim.username}"
      domain: "ACME"
      type: "user"
      host: "ws_victim"

attack:
  - id: "s1"
    host: "ws_victim"
    user: "victim"
    offset: 0
    event_type: "ProcessCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "medium"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Process created: synchost.exe"
    key_value_pairs:
      event_id: 1
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      process_id: "17892"
      image: "C:\\Users\\{victim.username}\\Downloads\\synchost.exe"
      file_version: ""
      description: ""
      product: ""
      company: ""
      original_file_name: ""
      command_line: "synchost.exe --dns domain={tunnel_domain.value} --secret=5a8f3e"
      current_directory: "C:\\Users\\{victim.username}\\Downloads\\"
      user: "{victim.user_domain}"
      terminal_session_id: "1"
      integrity_level: "Medium"
      parent_process_id: "8820"
      parent_image: "C:\\Windows\\System32\\cmd.exe"
      parent_command_line: "\"C:\\Windows\\System32\\cmd.exe\""
      parent_user: "{victim.user_domain}"

  - id: "s2"
    host: "ws_victim"
    offset: [5, 15]
    event_type: "QUERY"
    source_type: "DNS"
    log_source: "DNS"
    severity: "medium"
    hostname: "{infra.dns.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.dns.ip}"
    message: "DNS query received for encoded subdomain of unknown external domain."
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.dns.ip}"
      src_port: "54102"
      dest_port: "53"
      transport: "udp"
      query: "x7Kp2mNqR4vL9aWs1Tz.data.{tunnel_domain.value}"
      query_type: "TXT"
      message_type: "QUERY"
      reply_code: "NOERROR"
      dvc: "{infra.dns.hostname}"

  - id: "s3"
    host: "ws_victim"
    offset: [30, 60]
    trigger: true
    event_type: "QUERY"
    source_type: "DNS"
    log_source: "DNS"
    severity: "high"
    hostname: "{infra.dns.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.dns.ip}"
    message: "DNS query received for encoded subdomain of unknown external domain."
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.dns.ip}"
      src_port: "54103"
      dest_port: "53"
      transport: "udp"
      query: "Tz8bFnQjY2cXeU5dPm.data.{tunnel_domain.value}"
      query_type: "TXT"
      message_type: "QUERY"
      reply_code: "NOERROR"
      dvc: "{infra.dns.hostname}"

  - id: "s4"
    host: "ws_victim"
    offset: [1, 3]
    event_type: "ALLOW"
    source_type: "Firewall"
    log_source: "Firewall"
    severity: "high"
    hostname: "ACME-FW01"
    source_ip: "{victim.ip}"
    destination_ip: "8.8.8.8"
    message: "Outbound DNS query permitted to external resolver."
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "8.8.8.8"
      src_port: "54103"
      dest_port: "53"
      transport: "udp"
      action: "allow"
      app: "dns"
      dvc: "ACME-FW01"
      rule: "dns_outbound"

  - id: "s5"
    host: "ws_victim"
    offset: [30, 60]
    event_type: "QUERY"
    source_type: "DNS"
    log_source: "DNS"
    severity: "high"
    hostname: "{infra.dns.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.dns.ip}"
    message: "DNS query received for encoded subdomain of unknown external domain."
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.dns.ip}"
      src_port: "54105"
      dest_port: "53"
      transport: "udp"
      query: "Rw3nHqBkL6vMsY9cJp.data.{tunnel_domain.value}"
      query_type: "TXT"
      message_type: "QUERY"
      reply_code: "NOERROR"
      dvc: "{infra.dns.hostname}"

noise: {}

supplemental_events:
  - id: "sup1"
    host: "ws_victim"
    offset: -55
    red_herring: true
    event_type: "QUERY"
    source_type: "DNS"
    log_source: "DNS"
    severity: "low"
    hostname: "{infra.dns.hostname}"
    source_ip: "{victim.ip}"
    message: "DNS query A v10.events.data.microsoft.com"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.dns.ip}"
      src_port: "51837"
      dest_port: "53"
      transport: "udp"
      query: "v10.events.data.microsoft.com"
      query_type: "A"
      message_type: "QUERY"
      reply_code: "NOERROR"
      dvc: "{infra.dns.hostname}"
  - id: "sup2"
    host: "ws_victim"
    offset: -41
    red_herring: true
    event_type: "QUERY"
    source_type: "DNS"
    log_source: "DNS"
    severity: "low"
    hostname: "{infra.dns.hostname}"
    source_ip: "{victim.ip}"
    message: "DNS query A v10.events.data.microsoft.com"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.dns.ip}"
      src_port: "51902"
      dest_port: "53"
      transport: "udp"
      query: "v10.events.data.microsoft.com"
      query_type: "A"
      message_type: "QUERY"
      reply_code: "NOERROR"
      dvc: "{infra.dns.hostname}"
  - id: "sup3"
    host: "ws_victim"
    offset: -27
    red_herring: true
    event_type: "QUERY"
    source_type: "DNS"
    log_source: "DNS"
    severity: "low"
    hostname: "{infra.dns.hostname}"
    source_ip: "{victim.ip}"
    message: "DNS query A v10.events.data.microsoft.com"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.dns.ip}"
      src_port: "52014"
      dest_port: "53"
      transport: "udp"
      query: "v10.events.data.microsoft.com"
      query_type: "A"
      message_type: "QUERY"
      reply_code: "NOERROR"
      dvc: "{infra.dns.hostname}"

supplemental_entities:
  - id: "sup_ms_telemetry"
    type: "domain"
    value: "v10.events.data.microsoft.com"
    description: "Microsoft Windows diagnostic telemetry endpoint. Byte-identical to c2_http's sup_ms_telemetry literal; the benign high-volume DNS destination the FP resolves against by reputation and subdomain entropy."

detections:
  - id: "det_dns_tunnel"
    rule_name: "Anomalous DNS TXT Query Volume to Rare Domain"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["s3"]
    mitre:
      id: "T1071.004"
      tactic: "Command and Control"
    description: "Repeated TXT lookups to non-standard subdomains of a rarely seen parent domain, a common DNS tunneling and C2 pattern."
    disposition: "true_positive"
  - id: "det_dns_loader_exec"
    rule_name: "Process from Downloads Generating Anomalous DNS"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["s1"]
    mitre:
      id: "T1071.004"
      tactic: "Command and Control"
    description: "A binary launched from the user's Downloads folder is the source of the anomalous DNS traffic, the tunnel client that established the covert channel."
    disposition: "true_positive"
  - id: "det_dns_volume_fp"
    rule_name: "High-Volume DNS Query Rate to Single Domain"
    rule_type: "sigma_behavioral"
    severity: "medium"
    triggers: ["sup1", "sup2", "sup3"]
    mitre:
      id: "T1071.004"
      tactic: "Command and Control"
    description: "A host issued many DNS queries to one external domain in a short window, the volume shape of DNS beaconing or tunneling. It is a Microsoft telemetry agent's routine check-ins to a categorized vendor domain with normal-length, low-entropy hostnames, not the high-entropy data subdomains of a tunnel."
    disposition: "false_positive"

answer_key:
  classification: "Command & Control"
  scope:
    hosts: ["ws_victim"]
    accounts: ["victim"]
  root_cause: "s1"
  techniques: ["T1071.004"]
  actions: []

triage_review:
  mitre:
    id: "T1071.004"
    name: "Application Layer Protocol: DNS"
    tactic: "Command and Control"
    url: "https://attack.mitre.org/techniques/T1071/004/"
  what_is_it:
    title: "DNS Tunneling"
    description: "DNS tunneling is when malware hides command and control communication inside DNS queries by encoding data into long subdomain labels that route through normal DNS infrastructure to an attacker-controlled server. Because DNS traffic is rarely blocked or inspected, the channel operates over port 53 without triggering most security tools."
  response_actions:
    - "Isolate the host immediately as the tunnel is an active C2 channel"
    - "Kill the tunneling process and preserve the binary for analysis"
    - "Block the tunneling domain at the DNS server"
    - "Search DNS logs for other hosts querying the same domain"
    - "Investigate how the tunneling tool was delivered to the host"
