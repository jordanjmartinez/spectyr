# Schema v2 (Phase 2 Stage 0). Migrated from scenarios/phishing_1.yaml by
# scenarios/migrate_v1_to_v2.py; the attack steps are the v1 chain
# byte-for-byte plus id/host/user tags (parity_check_v2.py proves it).
# Edit this file, not the v1 copy, once the loader flag flips to yaml_v2.
schema_version: 2
label: "phishing_1"
category: "Phishing"
difficulty: 1
threat_pattern: "Typosquatting Credential Harvesting"

narrative:
  ticket_title: "M365 Account Login from Unusual Location"
  storyline: "An employee received a Microsoft 365 password reset email and clicked the link. The page looked like a normal Microsoft sign-in. The proxy logged the connection but did not block it. Shortly after, account activity was detected from an unexpected location."

entities:
  victim:
    type: "employee"
  lookalike:
    type: "domain"
    value: "micr0soft.com"
  lure_ip:
    type: "external_ip"
    ip: "185.234.72.19"
  attacker:
    type: "external_ip"
    ip: "91.204.227.15"

environment:
  org:
    name: "ACME Corp"
    domain: "acme.local"
  hosts:
    - id: "ws_victim"
      role: "workstation"
      hostname: "{victim.hostname}"
      ip: "{victim.ip}"
      os: "Windows 11 Enterprise"
      desc: "User workstation"
    - id: "proxy"
      role: "proxy"
      hostname: "{infra.proxy.hostname}"
      ip: "{infra.proxy.ip}"
      os: "PAN-OS"
      desc: "Proxy (PAN-OS VM-Series)"
  accounts:
    - id: "victim"
      username: "{victim.username}"
      domain: "ACME"
      type: "user"
      host: "ws_victim"

attack:
  - id: "s1"
    host: "ws_victim"
    user: "victim"
    offset: 0
    event_type: "HTTP_GET"
    source_type: "Proxy"
    log_source: "Proxy"
    severity: "medium"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{lure_ip.ip}"
    user_account: "ACME\\{victim.username}"
    message: "GET request to {lookalike.value}/signin returned 200 OK"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{lure_ip.ip}"
      src_user: "{victim.user_domain}"
      dvc: "{infra.proxy.hostname}"
      url: "{lookalike.value}/signin"
      app: "web-browsing"
      transport: "tcp"
      dest_port: "443"
      action: "allow"
      http_method: "GET"

  - id: "s2"
    host: "ws_victim"
    user: "victim"
    offset: [3, 8]
    event_type: "HTTP_POST"
    source_type: "Proxy"
    log_source: "Proxy"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{lure_ip.ip}"
    user_account: "ACME\\{victim.username}"
    message: "POST request submitted to {lookalike.value}/signin with non-zero body"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{lure_ip.ip}"
      src_user: "{victim.user_domain}"
      dvc: "{infra.proxy.hostname}"
      url: "{lookalike.value}/signin"
      app: "web-browsing"
      transport: "tcp"
      dest_port: "443"
      action: "allow"
      http_method: "POST"
      bytes_sent: "852"

  - id: "s3"
    host: "ws_victim"
    user: "victim"
    offset: [20, 60]
    event_type: "SigninLogs"
    source_type: "Azure AD"
    log_source: "Azure AD"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "{attacker.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Successful sign-in for {victim.username}@acme.com from {attacker.ip}"
    key_value_pairs:
      UserPrincipalName: "{victim.username}@acme.com"
      IPAddress: "{attacker.ip}"
      Location: "Shanghai, China"
      DeviceDetail: "Unknown"
      ResultType: "0"
      AppDisplayName: "Microsoft 365"
      AuthenticationRequirement: "singleFactorAuthentication"
      RiskLevelDuringSignIn: "high"
      OperationName: "Sign-in activity"

  - id: "s4"
    host: "ws_victim"
    user: "victim"
    offset: [5, 15]
    trigger: true
    event_type: "AADUserRiskEvents"
    source_type: "Azure AD"
    log_source: "Azure AD"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "{attacker.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Impossible travel risk flagged for {victim.username}@acme.com"
    key_value_pairs:
      UserPrincipalName: "{victim.username}@acme.com"
      RiskEventType: "unlikelyTravel"
      RiskLevel: "high"
      RiskState: "atRisk"
      RiskDetail: "none"
      DetectionTimingType: "realtime"
      Location: "Shanghai, China"
      IPAddress: "{attacker.ip}"

noise: {}

supplemental_events:
  - id: "sup1"
    host: "ws_victim"
    user: "victim"
    offset: -75
    red_herring: true
    event_type: "SigninLogs"
    source_type: "Azure AD"
    log_source: "Azure AD"
    severity: "medium"
    hostname: "{victim.hostname}"
    user_account: "ACME\\{victim.username}"
    message: "Non-interactive sign-in (refresh token) from a new location"
    key_value_pairs:
      UserPrincipalName: "{victim.username}@acme.com"
      IPAddress: "203.0.113.77"
      Location: "Austin, US"
      DeviceDetail: "Windows 10 - Compliant - Entra Joined"
      ResultType: "0"
      AppDisplayName: "Microsoft 365"
      IsInteractive: "false"
      AuthenticationRequirement: "multiFactorAuthentication"
      RiskLevelDuringSignIn: "medium"
      OperationName: "Sign-in activity"

supplemental_entities: []

detections:
  - id: "det_impossible_travel"
    rule_name: "Entra Impossible-Travel Risk Detection"
    rule_type: "sigma_behavioral"
    severity: "critical"
    triggers: ["s4"]
    mitre:
      id: "T1583.001"
      tactic: "Resource Development"
    description: "Entra ID flagged risky sign-in activity from an unexpected location after a credential-harvest page interaction."
    disposition: "true_positive"
  - id: "det_credential_post"
    rule_name: "Credentials Submitted to a Lookalike Domain"
    rule_type: "sigma_behavioral"
    severity: "medium"
    triggers: ["s2"]
    mitre:
      id: "T1566.002"
      tactic: "Initial Access"
    description: "Credentials were POSTed to a sign-in form on a newly-registered lookalike domain, the credential-harvest step."
    disposition: "true_positive"
  - id: "det_benign_risky_signin_fp"
    rule_name: "Risky Sign-In From New Location"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["sup1"]
    mitre:
      id: "T1078"
      tactic: "Initial Access"
    description: "A risky sign-in from an unexpected location reads like account takeover. It is a non-interactive OAuth refresh-token renewal from a known compliant device with MFA satisfied, not an interactive sign-in following a credential-harvest page."
    disposition: "false_positive"

answer_key:
  classification: "Phishing"
  scope:
    hosts: ["ws_victim"]
    accounts: ["victim"]
  root_cause: "s1"
  techniques: ["T1583.001"]
  actions_reviewed: true
  actions:
    - action: "revoke_sessions"
      status: "required"
      target:
        account: "victim"
    - action: "force_password_reset"
      status: "required"
      target:
        account: "victim"
    - action: "disable_account"
      status: "acceptable"
      target:
        account: "victim"
  traps:
    - action: "isolate_host"
      target:
        host: "ws_victim"

triage_review:
  mitre:
    id: "T1583.001"
    name: "Acquire Infrastructure: Domains"
    tactic: "Resource Development"
    url: "https://attack.mitre.org/techniques/T1583/001/"
  what_is_it:
    title: "Typosquatting"
    description: "Typosquatting is when attackers register domains that look almost identical to legitimate ones to trick users into visiting them, using techniques like character substitution, missing or extra characters, wrong TLDs, or visually identical characters from different alphabets."
  response_actions:
    - "Block the domain"
    - "Identify any users who visited it or entered credentials"
    - "Reset credentials for any affected users"
    - "Search logs for other lookalike domains from the same source"
    - "Report the domain to the registrar"

# Stage 5 D2 (Tier 2 rationale; ledger-tracked): frozen into a
# submission record as scenario_rationale, rendered only in the
# post-boundary Learning Review Key takeaway.
expected_response: >-
  This was a credential phish: the victim entered their password on an
  attacker page, and the evidence shows the account being abused, not the
  workstation being compromised. The response evicts the attacker from the
  identity: revoke the account's active sessions so stolen tokens die, and
  force a password reset so the stolen secret stops working. Disabling the
  account also works and is defensible, but eviction plus reset already
  closes the breach with less disruption. Isolating the workstation is the
  tempting wrong move: no malware ran there, so host containment addresses
  an asset the attacker never controlled.
