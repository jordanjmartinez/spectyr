# Schema v2 (Phase 2 Stage 0). Migrated from scenarios/insider_staging.yaml by
# scenarios/migrate_v1_to_v2.py; the attack steps are the v1 chain
# byte-for-byte plus id/host/user tags (parity_check_v2.py proves it).
# Edit this file, not the v1 copy, once the loader flag flips to yaml_v2.
schema_version: 2
label: "insider_staging"
category: "Insider Threat"
difficulty: 3
threat_pattern: "Insider Threat Data Staging"

narrative:
  ticket_title: "Unauthorized Access to Financial Records"
  storyline: "A user account accessed a file share containing sensitive financial records outside of their normal role. A document was copied locally before an outbound connection was established to a personal cloud storage service. No transfer approval or business justification exists for this activity."

entities:
  insider:
    type: "employee"
  exfil_domain:
    type: "domain"
    value: "drive.google.com"
  exfil_ip:
    type: "external_ip"
    ip: "142.250.80.46"

environment:
  org:
    name: "ACME Corp"
    domain: "acme.local"
  hosts:
    - id: "ws_victim"
      role: "workstation"
      hostname: "{insider.hostname}"
      ip: "{insider.ip}"
      os: "Windows 11 Enterprise"
      desc: "User workstation"
    - id: "file"
      role: "file"
      hostname: "{infra.file.hostname}"
      ip: "{infra.file.ip}"
      os: "Windows Server 2019"
      desc: "File Server"
    - id: "proxy"
      role: "proxy"
      hostname: "{infra.proxy.hostname}"
      ip: "{infra.proxy.ip}"
      os: "PAN-OS"
      desc: "Proxy (PAN-OS VM-Series)"
  accounts:
    - id: "insider"
      username: "{insider.username}"
      domain: "ACME"
      type: "user"
      host: "ws_victim"

attack:
  - id: "s1"
    host: "file"
    user: "insider"
    offset: 0
    event_type: "4624"
    source_type: "Windows Security"
    log_source: "Windows Security"
    severity: "low"
    hostname: "{infra.file.hostname}"
    source_ip: "{insider.ip}"
    destination_ip: "{infra.file.ip}"
    message: "An account was successfully logged on."
    key_value_pairs:
      event_id: 4624
      channel: "WinEventLog:Security"
      computer: "{infra.file.hostname}"
      subject_security_id: "NULL SID"
      subject_account_name: "-"
      subject_account_domain: "-"
      subject_logon_id: "0x0"
      logon_type: "3"
      account_name: "{insider.username}"
      account_domain: "ACME"
      new_logon_logon_id: "0x9C4D82"
      logon_guid: "{00000000-0000-0000-0000-000000000000}"
      process_id: "0x0"
      process_name: "-"
      workstation_name: "{insider.hostname}"
      src_ip: "{insider.ip}"
      src_port: "50892"
      logon_process: "Kerberos"
      authentication_package: "Kerberos"
      transited_services: "-"
      package_name: "-"
      key_length: "0"

  - id: "s2"
    host: "file"
    user: "insider"
    offset: [30, 90]
    event_type: "5140"
    source_type: "Windows Security"
    log_source: "Windows Security"
    severity: "medium"
    hostname: "{infra.file.hostname}"
    source_ip: "{insider.ip}"
    destination_ip: "{infra.file.ip}"
    message: "A network share object was accessed."
    key_value_pairs:
      event_id: 5140
      channel: "WinEventLog:Security"
      computer: "{infra.file.hostname}"
      subject_user_sid: "S-1-5-21-1547161642-1842894336-919524151-1105"
      account_name: "{insider.username}"
      account_domain: "ACME"
      subject_logon_id: "0x9C4D82"
      object_type: "File"
      src_ip: "{insider.ip}"
      src_port: "50892"
      share_name: "\\\\*\\Finance"
      share_local_path: "\\??\\C:\\Finance"
      access_mask: "0x1"
      accesses: "ReadData (or ListDirectory)"

  - id: "s3"
    host: "ws_victim"
    user: "insider"
    offset: [5, 15]
    event_type: "FileCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "medium"
    hostname: "{insider.hostname}"
    source_ip: "{insider.ip}"
    user_account: "ACME\\{insider.username}"
    message: "File created: Q4_2025_Earnings_Draft.xlsx"
    key_value_pairs:
      event_id: 11
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{insider.hostname}"
      rule_name: ""
      process_id: "4412"
      image: "C:\\Windows\\explorer.exe"
      target_filename: "C:\\Users\\{insider.username}\\Desktop\\Project_Archive\\Q4_2025_Earnings_Draft.xlsx"
      user: "{insider.user_domain}"

  - id: "s4"
    host: "ws_victim"
    user: "insider"
    offset: [2, 5]
    event_type: "NetworkConnect"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "medium"
    hostname: "{insider.hostname}"
    source_ip: "{insider.ip}"
    destination_ip: "{exfil_ip.ip}"
    user_account: "ACME\\{insider.username}"
    message: "Outbound connection to {exfil_domain.value} initiated by chrome.exe"
    key_value_pairs:
      event_id: 3
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{insider.hostname}"
      rule_name: ""
      process_id: "7832"
      image: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
      user: "{insider.user_domain}"
      protocol: "tcp"
      initiated: true
      source_is_ipv6: false
      source_ip: "{insider.ip}"
      source_hostname: "{insider.hostname}"
      source_port_name: ""
      destination_is_ipv6: false
      destination_ip: "{exfil_ip.ip}"
      destination_hostname: "{exfil_domain.value}"
      destination_port: "443"
      destination_port_name: "https"

  - id: "s5"
    host: "ws_victim"
    user: "insider"
    offset: [5, 15]
    trigger: true
    event_type: "HTTP_CONNECT"
    source_type: "Proxy"
    log_source: "Proxy"
    severity: "high"
    hostname: "{insider.hostname}"
    source_ip: "{insider.ip}"
    destination_ip: "{exfil_ip.ip}"
    user_account: "ACME\\{insider.username}"
    message: "CONNECT tunnel established to {exfil_domain.value} on port 443"
    key_value_pairs:
      src_ip: "{insider.ip}"
      dst_ip: "{exfil_ip.ip}"
      src_user: "{insider.user_domain}"
      dvc: "{infra.proxy.hostname}"
      url: "{exfil_domain.value}:443"
      app: "web-browsing"
      transport: "tcp"
      dest_port: "443"
      action: "allow"
      http_method: "CONNECT"

noise: {}

supplemental_events:
  - id: "sup1"
    host: "ws_victim"
    user: "insider"
    offset: -85
    red_herring: true
    event_type: "190"
    source_type: "Veeam"
    log_source: "Veeam"
    severity: "low"
    hostname: "{insider.hostname}"
    source_ip: "{insider.ip}"
    message: "Veeam Agent backup job completed: 1.75 GB to ACME-VEEAM01"
    key_value_pairs:
      host: "{insider.hostname}"
      src_ip: "{insider.ip}"
      event_log: "Veeam Agent"
      event_id: "190"
      event_level: "Information"
      job_name: "{insider.hostname} Nightly Backup"
      status: "Success"
      bytes_backed_up: "1879048192"
      bytes_backed_up_human: "1.75 GB"
      repository: "ACME-VEEAM01"
      repository_ip: "10.0.1.206"
      duration_seconds: "4208"
      scheduled_time: "22:00"

supplemental_entities: []

detections:
  - id: "det_staging"
    rule_name: "Sensitive Share Access Then Local Staging"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["s5"]
    mitre:
      id: "T1074.001"
      tactic: "Collection"
    description: "A user accessed a sensitive file share outside their role and staged a copy locally before an outbound connection."
    disposition: "true_positive"
  - id: "det_share_harvest"
    rule_name: "Sensitive File Share Accessed Outside Role"
    rule_type: "sigma_behavioral"
    severity: "medium"
    triggers: ["s2"]
    mitre:
      id: "T1074.001"
      tactic: "Collection"
    description: "A user opened a sensitive file share (5140) they have no role-based reason to touch, the collection step before staging."
    disposition: "true_positive"
  - id: "det_mass_egress_fp"
    rule_name: "Large Off-Hours Data Egress Volume"
    rule_type: "sigma_behavioral"
    severity: "critical"
    triggers: ["sup1"]
    mitre:
      id: "T1567.002"
      tactic: "Exfiltration"
    description: "Over 1.75 GB left the host, the volume-plus-timing shape of staged exfiltration. It is the scheduled Veeam endpoint backup completing to the internal repository, logged by Veeam itself, not an outbound transfer to an external host."
    disposition: "false_positive"

answer_key:
  classification: "Insider Threat"
  scope:
    hosts: ["file", "ws_victim"]
    accounts: ["insider"]
  root_cause: "s1"
  techniques: ["T1074.001"]
  actions_reviewed: true
  actions:
    - action: "disable_account"
      status: "required"
      target:
        account: "insider"
    - action: "revoke_sessions"
      status: "required"
      target:
        account: "insider"
    - action: "isolate_host"
      status: "required"
      target:
        host: "ws_victim"
    - action: "kill_process"
      status: "acceptable"
      target:
        host: "ws_victim"
        pid: 7832
    - action: "force_password_reset"
      status: "acceptable"
      target:
        account: "insider"
  traps:
    - action: "isolate_host"
      target:
        host: "file"

triage_review:
  mitre:
    id: "T1074.001"
    name: "Data Staged: Local Data Staging"
    tactic: "Collection"
    url: "https://attack.mitre.org/techniques/T1074/001/"
  what_is_it:
    title: "Insider Threat Data Staging"
    description: "Insider threat data staging is when a trusted employee uses their legitimate access to collect and consolidate sensitive files into a centralized local folder before exfiltrating them. It is primarily detected through behavioral anomalies like bulk downloads, after-hours file activity, and access to resources outside the employee's normal job function."
  response_actions:
    - "Do not alert the employee to preserve evidence"
    - "Capture a forensic snapshot of the workstation and staging folder"
    - "Engage HR and Legal before any direct employee contact"
    - "Verify whether the employee has a legitimate business need for the staged data"
    - "Monitor for exfiltration activity such as USB connections, personal email, or cloud uploads"

# Stage 5 D2 (Tier 2 rationale; ledger-tracked): frozen into a
# submission record as scenario_rationale, rendered only in the
# post-boundary Learning Review Key takeaway.
expected_response: >-
  A trusted insider used their own valid account to stage sensitive files
  from the file server onto their workstation. Because the actor is the
  account, identity comes first: disable the insider's account and revoke
  its sessions so no further access is possible, and isolate the workstation
  holding the staged data. Terminating the staging process and resetting the
  password are defensible additions. Isolating the file server is the
  tempting wrong move: it takes a shared service down when the access has
  already been cut at the account.
