# Schema v2 (Phase 2 Stage 0). Migrated from scenarios/phishing_link.yaml by
# scenarios/migrate_v1_to_v2.py; the attack steps are the v1 chain
# byte-for-byte plus id/host/user tags (parity_check_v2.py proves it).
# Edit this file, not the v1 copy, once the loader flag flips to yaml_v2.
schema_version: 2
label: "phishing_link"
category: "Phishing"
difficulty: 2
threat_pattern: "Spearphishing Link (Payload Download)"

narrative:
  ticket_title: "Rogue Program on Workstation"
  storyline: "An employee contacted the help desk after interacting with an email they now believe may have been fraudulent. The email appeared to come from a trusted third-party service. Endpoint and proxy logs show activity on the workstation following the interaction."

entities:
  victim:
    type: "employee"
  phish_domain:
    type: "domain"
    value: "docusign-portal.net"
  phish_ip:
    type: "external_ip"
    ip: "91.215.85.29"

environment:
  org:
    name: "ACME Corp"
    domain: "acme.local"
  hosts:
    - id: "ws_victim"
      role: "workstation"
      hostname: "{victim.hostname}"
      ip: "{victim.ip}"
      os: "Windows 10 Enterprise"
      desc: "User workstation"
    - id: "dns"
      role: "dns"
      hostname: "{infra.dns.hostname}"
      ip: "{infra.dns.ip}"
      os: "Windows Server 2019"
      desc: "DNS Server"
    - id: "proxy"
      role: "proxy"
      hostname: "{infra.proxy.hostname}"
      ip: "{infra.proxy.ip}"
      os: "PAN-OS"
      desc: "Proxy (PAN-OS VM-Series)"
  accounts:
    - id: "victim"
      username: "{victim.username}"
      domain: "ACME"
      type: "user"
      host: "ws_victim"

attack:
  - id: "s1"
    host: "ws_victim"
    offset: 0
    event_type: "QUERY"
    source_type: "DNS"
    log_source: "DNS"
    severity: "low"
    hostname: "{infra.dns.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{infra.dns.ip}"
    message: "DNS query received for {phish_domain.value}"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{infra.dns.ip}"
      src_port: "52847"
      dest_port: "53"
      transport: "udp"
      query: "{phish_domain.value}"
      query_type: "A"
      message_type: "QUERY"
      reply_code: "NOERROR"
      dvc: "{infra.dns.hostname}"

  - id: "s2"
    host: "ws_victim"
    user: "victim"
    offset: [2, 5]
    event_type: "HTTP_GET"
    source_type: "Proxy"
    log_source: "Proxy"
    severity: "medium"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    destination_ip: "{phish_ip.ip}"
    user_account: "ACME\\{victim.username}"
    message: "GET request to {phish_domain.value} returned 200 OK"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "{phish_ip.ip}"
      src_user: "{victim.user_domain}"
      dvc: "{infra.proxy.hostname}"
      url: "{phish_domain.value}/secure/Invoice_2026-0127.exe"
      app: "web-browsing"
      transport: "tcp"
      dest_port: "443"
      action: "allow"
      http_method: "GET"
      content_type: "application/octet-stream"
      bytes_received: "248576"

  - id: "s3"
    host: "ws_victim"
    user: "victim"
    offset: [10, 30]
    trigger: true
    event_type: "ProcessCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Process created: Invoice_2026-0127.exe"
    key_value_pairs:
      event_id: 1
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      process_id: "11284"
      image: "C:\\Users\\{victim.username}\\Downloads\\Invoice_2026-0127.exe"
      file_version: ""
      description: ""
      product: ""
      company: ""
      original_file_name: "Invoice_2026-0127.exe"
      command_line: "Invoice_2026-0127.exe"
      current_directory: "C:\\Users\\{victim.username}\\Downloads\\"
      user: "{victim.user_domain}"
      terminal_session_id: "1"
      integrity_level: "Medium"
      parent_process_id: "3456"
      parent_image: "C:\\Windows\\explorer.exe"
      parent_command_line: "C:\\Windows\\explorer.exe"
      parent_user: "{victim.user_domain}"

  - id: "s4"
    host: "ws_victim"
    user: "victim"
    offset: [3, 8]
    event_type: "ProcessCreate"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Process created: powershell.exe spawned by Invoice_2026-0127.exe"
    key_value_pairs:
      event_id: 1
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      process_id: "13056"
      image: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
      file_version: "10.0.19041.1"
      description: "Windows PowerShell"
      product: "Microsoft Windows Operating System"
      company: "Microsoft Corporation"
      original_file_name: "PowerShell.EXE"
      command_line: "powershell.exe -ExecutionPolicy Bypass -WindowStyle Hidden -Command \"Add-MpPreference -ExclusionPath 'C:\\Users\\{victim.username}\\AppData\\Roaming'\""
      current_directory: "C:\\Users\\{victim.username}\\Downloads\\"
      user: "{victim.user_domain}"
      terminal_session_id: "1"
      integrity_level: "Medium"
      parent_process_id: "11284"
      parent_image: "C:\\Users\\{victim.username}\\Downloads\\Invoice_2026-0127.exe"
      parent_command_line: "Invoice_2026-0127.exe"
      parent_user: "{victim.user_domain}"

  - id: "s5"
    host: "ws_victim"
    user: "victim"
    offset: [1, 3]
    event_type: "SetValue"
    source_type: "Sysmon"
    log_source: "Sysmon"
    severity: "high"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "Registry Run key modified by Invoice_2026-0127.exe"
    key_value_pairs:
      event_id: 13
      channel: "Microsoft-Windows-Sysmon/Operational"
      computer: "{victim.hostname}"
      rule_name: ""
      event_type: "SetValue"
      process_id: "11284"
      image: "C:\\Users\\{victim.username}\\Downloads\\Invoice_2026-0127.exe"
      target_object: "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\InvoiceService"
      details: "C:\\Users\\{victim.username}\\AppData\\Roaming\\InvoiceService.exe"
      user: "{victim.user_domain}"

noise: {}

supplemental_events:
  - id: "sup1"
    host: "ws_victim"
    user: "victim"
    offset: -65
    red_herring: true
    event_type: "HTTP_GET"
    source_type: "Proxy"
    log_source: "Proxy"
    severity: "low"
    hostname: "{victim.hostname}"
    source_ip: "{victim.ip}"
    user_account: "ACME\\{victim.username}"
    message: "GET document from acme-my.sharepoint.com"
    key_value_pairs:
      src_ip: "{victim.ip}"
      dst_ip: "52.96.128.144"
      src_user: "{victim.user_domain}"
      dvc: "{infra.proxy.hostname}"
      url: "https://acme-my.sharepoint.com/personal/{victim.username}_acme_com/Documents/Q3_Report.docx"
      app: "microsoft-onedrive"
      transport: "tcp"
      dest_port: "443"
      action: "allow"
      http_method: "GET"
      content_type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      bytes_received: "184320"

supplemental_entities:
  - id: "sup_sharepoint"
    type: "domain"
    value: "acme-my.sharepoint.com"
    description: "The corporate SharePoint/OneDrive tenant (real Microsoft domain). Byte-identical tenant literal (4th consumer); the sanctioned download source the FP resolves to, vs the phishing domain."

detections:
  - id: "det_link_payload"
    rule_name: "Payload Process Spawned After Email Link Click"
    rule_type: "sigma_behavioral"
    severity: "critical"
    triggers: ["s3"]
    mitre:
      id: "T1566.002"
      tactic: "Initial Access"
    description: "A process launched from a user profile path shortly after the user followed a link to a lookalike domain."
    disposition: "true_positive"
  - id: "det_payload_persistence"
    rule_name: "Run Key Persistence Written by a Download"
    rule_type: "sigma_behavioral"
    severity: "medium"
    triggers: ["s5"]
    mitre:
      id: "T1547.001"
      tactic: "Persistence"
    description: "The downloaded payload wrote a Run key pointing to a copy of itself in AppData, establishing persistence."
    disposition: "true_positive"
  - id: "det_doc_download_fp"
    rule_name: "Document Downloaded From an External Site"
    rule_type: "sigma_behavioral"
    severity: "high"
    triggers: ["sup1"]
    mitre:
      id: "T1566.002"
      tactic: "Initial Access"
    description: "A file downloaded from an external site reads like the malicious invoice lure. It is a routine document download from the sanctioned corporate SharePoint/OneDrive tenant, not the phishing domain."
    disposition: "false_positive"

answer_key:
  classification: "Phishing"
  scope:
    hosts: ["ws_victim"]
    accounts: ["victim"]
  root_cause: "s1"
  techniques: ["T1566.002"]
  actions_reviewed: true
  actions:
    - action: "isolate_host"
      status: "required"
      target:
        host: "ws_victim"
    - action: "kill_process"
      status: "required"
      target:
        host: "ws_victim"
        pid: 11284
    - action: "delete_file"
      status: "required"
      target:
        host: "ws_victim"
        path: "C:\\Users\\{victim.username}\\AppData\\Roaming\\InvoiceService.exe"
    - action: "kill_process"
      status: "acceptable"
      target:
        host: "ws_victim"
        pid: 13056
  traps:
    - action: "disable_account"
      target:
        account: "victim"
    - action: "isolate_host"
      target:
        host: "dns"

triage_review:
  mitre:
    id: "T1566.002"
    name: "Phishing: Spearphishing Link"
    tactic: "Initial Access"
    url: "https://attack.mitre.org/techniques/T1566/002/"
  what_is_it:
    title: "Spearphishing Link"
    description: "Spearphishing with a link is when attackers send targeted emails containing URLs to malicious files instead of attaching them directly. This bypasses email security that scans attachments but may not inspect linked content. Attackers typically impersonate trusted services like DocuSign, SharePoint, or Dropbox to convince the victim to click, download, and execute the payload."
  response_actions:
    - "Isolate the affected workstation"
    - "Block the phishing domain and IP"
    - "Preserve the downloaded file for analysis"
    - "Search email and proxy logs for other users who received the same link"
    - "Check the host for post-execution activity"
    - "Quarantine the original phishing email across all mailboxes"
